# =============================================================================
# Example 2: Multi-hop relay chain (Edge -> Relay A -> Relay B -> PasarGuard).
#
# The chain object describes the whole traffic path; the generator resolves
# the final backend target while the validator checks every hop and rejects
# loops.
# =============================================================================
version: 1

node:
  id: edge-a
  roles:
    - edge

defaults:
  read_timeout: 1w

certificates:
  - id: edge-cert
    provider: existing
    chain: /root/fullchain.pem
    key: /root/privkey.pem

listeners:
  - id: public-https
    address: 0.0.0.0
    port: 443
    mode: http
    tls:
      mode: terminate
      certificate: edge-cert

backends:
  - id: central-pg
    type: local
    host: 127.0.0.1
    port: 62050

tunnels:
  - id: edge-to-relay-b
    mode: direct
    provider: custom
    remote:
      node: relay-b
      host: 10.0.0.20
      port: 40001
    target:
      host: 10.0.0.21
      port: 40002

  - id: relay-b-to-relay-c
    mode: direct
    provider: custom
    remote:
      node: relay-c
      host: 10.0.0.21
      port: 40002
    target:
      host: 127.0.0.1
      port: 62050

chains:
  - id: nl-chain
    chain:
      - type: listener
        id: public-https
      - type: route
        id: nl-route
      - type: tunnel
        id: edge-to-relay-b
      - type: tunnel
        id: relay-b-to-relay-c
      - type: backend
        id: central-pg

routes:
  - id: nl-route
    listener: public-https
    transport:
      type: ws
    match:
      type: path_prefix
      value: /nl
    backend: central-pg
    chain: nl-chain
